spring:
  datasource:
    url: jdbc:h2:mem:agencydb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: aVerySecretKeyThatMustBeAtLeast32BytesLongForHmacSha256!
  expirationMs: 86400000 # 24 ore
